<title>Mossgrove Wilds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: one handheld "console" centered on a moss-dark field; screen on top, controls below. Single deliberate dark look. */
:root{
  --field:#0f1f18; --frame:#1f3a2c; --frame-hi:#2d5440; --ink:#14201a;
  --paper:#eef5e6; --paper-2:#d7e6cc; --amber:#f2c94c; --muted:#9db8a6;
  --good:#4cc35a; --mid:#f2c94c; --low:#e0533f;
  --display:"Silkscreen", ui-monospace, monospace;
  --body:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--field);color:var(--paper)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,34px);margin:0;letter-spacing:.02em;color:var(--amber);text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:15px}
.console{background:var(--frame);border-radius:18px 18px 40px 18px;padding:14px;box-shadow:inset 0 2px 0 var(--frame-hi),0 10px 30px #0008;display:flex;flex-direction:column;gap:14px}
.screen{position:relative;width:100%;aspect-ratio:3/2;background:#000;border:4px solid var(--ink);border-radius:6px;overflow:hidden;container-type:inline-size;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.screen *{box-sizing:border-box}
.box{position:absolute;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:4px;box-shadow:inset 0 0 0 2px var(--paper-2);font-size:clamp(11px,3.3cqw,21px);line-height:1.25}
#textbox{left:1.5%;right:1.5%;bottom:2%;height:30%;padding:.5em .8em;cursor:pointer}
#textbox p{margin:0;white-space:pre-wrap}
#textbox .next{position:absolute;right:.6em;bottom:.3em;opacity:0;font-family:var(--display);font-size:.8em}
#textbox.ready .next{opacity:1;animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#menu{left:1.5%;right:1.5%;bottom:2%;max-height:94%;padding:.4em;display:grid;gap:.3em;overflow:auto}
#menu .ttl{grid-column:1/-1;font-family:var(--display);font-size:.8em;padding:.1em .4em;color:#3c5a48}
#menu button{font:inherit;color:var(--ink);background:transparent;border:2px solid transparent;border-radius:3px;padding:.25em .5em;text-align:left;cursor:pointer;display:flex;align-items:center;gap:.5em;min-height:2em}
#menu button.sel{border-color:var(--ink);background:var(--paper-2)}
#menu button.sel::before{content:"▶";font-size:.7em}
#menu button:disabled{opacity:.4;cursor:default}
#menu button img{width:3.2em;height:3.2em;image-rendering:pixelated}
#menu .sub{display:block;font-size:.72em;color:#3c5a48}
#menu .lbl{flex:1;min-width:0}
.tag{font-family:var(--display);font-size:.6em;padding:.15em .4em;border-radius:3px;color:#fff;border:1px solid var(--ink);white-space:nowrap}
.hud{position:absolute;width:47%;padding:.3em .6em .4em;font-size:clamp(10px,2.9cqw,19px)}
#ehud{left:2%;top:3%}
#phud{right:2%;top:43%}
.hud .row{display:flex;justify-content:space-between;align-items:baseline;gap:.4em;font-family:var(--display)}
.hud .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:.55em;background:#3a4a40;border:2px solid var(--ink);border-radius:3px;margin-top:.2em;display:flex;align-items:center;gap:.3em;position:relative}
.bar i{display:block;height:100%;background:var(--good);transition:width .45s steps(12)}
.hpn{font-family:var(--display);font-size:.8em;text-align:right;margin-top:.15em}
.xp{height:.3em;background:#3a4a40;margin-top:.25em;border-radius:2px}
.xp i{display:block;height:100%;background:#4aa3df;transition:width .5s}
#title{inset:0;position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em;background:linear-gradient(#0f1f18cc,#0f1f18ee);font-size:clamp(11px,3.4cqw,22px);text-align:center;padding:1em}
#title h2{font-family:var(--display);color:var(--amber);font-size:2.2em;margin:0;line-height:1;text-shadow:3px 3px 0 var(--ink)}
#title p{margin:0;color:var(--muted)}
#title .btns{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center;margin-top:.4em}
#title button{font:inherit;font-family:var(--display);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:4px;padding:.4em .9em;cursor:pointer}
#title button:focus-visible,#menu button:focus-visible,.pad button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.pad{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 8px 8px}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
.dpad button,.ab button,.mid button{font-family:var(--display);color:var(--paper);background:var(--ink);border:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
.dpad button{font-size:18px}
.dpad .u{grid-area:1/2;border-radius:8px 8px 0 0}.dpad .l{grid-area:2/1;border-radius:8px 0 0 8px}.dpad .c{grid-area:2/2;background:var(--ink);pointer-events:none}.dpad .r{grid-area:2/3;border-radius:0 8px 8px 0}.dpad .d{grid-area:3/2;border-radius:0 0 8px 8px}
.dpad button:active,.ab button:active,.mid button:active{background:#000}
.ab{display:flex;gap:14px;transform:rotate(-14deg)}
.ab button{width:62px;height:62px;border-radius:50%;font-size:20px;background:#7a2d3a;box-shadow:0 4px 0 #3d141c}
.ab button.b{margin-top:30px;background:#5a3a6a;box-shadow:0 4px 0 #2a1834}
.mid{display:flex;flex-direction:column;gap:8px;align-items:center}
.mid button{font-size:11px;padding:6px 12px;border-radius:12px;background:#163024;color:var(--muted)}
.mid span{font-family:var(--display);font-size:10px;color:var(--muted)}
.help{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:15px;line-height:1.5}
kbd{font-family:var(--display);font-size:11px;background:var(--frame);border:1px solid var(--frame-hi);border-bottom-width:3px;border-radius:4px;padding:1px 6px;color:var(--paper)}
.help b{color:var(--paper);font-weight:600}
@media (max-width:420px){.dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}.ab button{width:54px;height:54px}}
@media (prefers-reduced-motion:reduce){#textbox.ready .next{animation:none}.bar i,.xp i{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Mossgrove Wilds</h1>
    <p>Catch, train and battle creatures of the grove.</p>
  </header>

  <div class="console">
    <div class="screen" id="screen">
      <canvas id="cv" width="240" height="160"></canvas>
      <div class="box hud" id="ehud" hidden>
        <div class="row"><span class="nm" id="enm"></span><span id="elv"></span></div>
        <div class="bar"><i id="ebar"></i></div>
      </div>
      <div class="box hud" id="phud" hidden>
        <div class="row"><span class="nm" id="pnm"></span><span id="plv"></span></div>
        <div class="bar"><i id="pbar"></i></div>
        <div class="hpn" id="phpn"></div>
        <div class="xp"><i id="pxp"></i></div>
      </div>
      <div class="box" id="menu" hidden></div>
      <div class="box" id="textbox" hidden><p id="text"></p><span class="next">▼</span></div>
      <div id="title">
        <h2>Mossgrove<br>Wilds</h2>
        <p>A tiny creature-catching adventure</p>
        <div class="btns">
          <button id="btnContinue" hidden>Continue</button>
          <button id="btnNew">New game</button>
        </div>
      </div>
    </div>

    <div class="pad" aria-label="Game controls">
      <div class="dpad">
        <button class="u" data-dir="up" aria-label="Up">▲</button>
        <button class="l" data-dir="left" aria-label="Left">◀</button>
        <span class="c"></span>
        <button class="r" data-dir="right" aria-label="Right">▶</button>
        <button class="d" data-dir="down" aria-label="Down">▼</button>
      </div>
      <div class="mid">
        <button id="btnMenu">MENU</button>
        <button id="btnSound">SOUND: OFF</button>
      </div>
      <div class="ab">
        <button class="b" data-key="B" aria-label="B button">B</button>
        <button class="a" data-key="A" aria-label="A button">A</button>
      </div>
    </div>
  </div>

  <div class="help">
    <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>WASD</kbd> move</span>
    <span><kbd>Z</kbd> / <kbd>Enter</kbd> <b>A</b>: talk, confirm</span>
    <span><kbd>X</kbd> / <kbd>Esc</kbd> <b>B</b>: back, open menu</span>
    <span>Walk in tall grass to find wild creatures. Beat the Grove Warden at the northern shrine.</span>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const VW = 240, VH = 160, TS = 16;

/* ---------- helpers ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function anim(ms, fn) { return new Promise(res => { const t0 = performance.now(); function f(now) { const t = Math.min(1, (now - t0) / ms); fn(t); if (t < 1) requestAnimationFrame(f); else res(); } requestAnimationFrame(f); }); }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(h, amt) { const [r, g, b] = hex2rgb(h); const f = c => clamp(Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt), 0, 255); return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join(''); }

/* ---------- sound ---------- */
let AC = null, soundOn = false;
function blip(freq = 440, dur = .07, type = 'square', vol = .05) {
  if (!soundOn) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = freq; g.gain.value = vol; g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + dur); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + dur); } catch (e) { }
}
const sfx = { sel: () => blip(660, .05), back: () => blip(330, .05), hit: () => { blip(120, .12, 'sawtooth', .08); }, super: () => { blip(160, .1, 'sawtooth', .09); setTimeout(() => blip(90, .15, 'sawtooth', .09), 80); }, lvl: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, .09), i * 90)), catch: () => [784, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, .1, 'triangle', .07), i * 110)), heal: () => [440, 554, 659, 880].forEach((f, i) => setTimeout(() => blip(f, .12, 'triangle', .06), i * 120)) };

/* ---------- pixel sprite raster ---------- */
function raster(w, h, draw, outline = '#16221b') {
  const px = new Array(w * h).fill(null);
  const set = (x, y, c) => { x = Math.floor(x); y = Math.floor(y); if (x >= 0 && y >= 0 && x < w && y < h && c) px[y * w + x] = c; };
  const a = {
    set,
    rect(x, y, rw, rh, c) { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) set(x + i, y + j, c); },
    ell(cx, cy, rx, ry, c, sh, hi) {
      for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
        const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) { let col = c; if (sh && dx * .45 + dy * .85 > .5) col = sh; if (hi && -dx * .6 - dy * .8 > .62) col = hi; set(x, y, col); }
      }
    },
    tri(ax, ay, bx, by, cx2, cy2, c) {
      const minx = Math.floor(Math.min(ax, bx, cx2)), maxx = Math.ceil(Math.max(ax, bx, cx2)), miny = Math.floor(Math.min(ay, by, cy2)), maxy = Math.ceil(Math.max(ay, by, cy2));
      const s = (x1, y1, x2, y2, x3, y3) => (x1 - x3) * (y2 - y3) - (x2 - x3) * (y1 - y3);
      for (let y = miny; y <= maxy; y++) for (let x = minx; x <= maxx; x++) { const px_ = x + .5, py = y + .5; const d1 = s(px_, py, ax, ay, bx, by), d2 = s(px_, py, bx, by, cx2, cy2), d3 = s(px_, py, cx2, cy2, ax, ay); const neg = d1 < 0 || d2 < 0 || d3 < 0, pos = d1 > 0 || d2 > 0 || d3 > 0; if (!(neg && pos)) set(x, y, c); }
    },
    line(x0, y0, x1, y1, c) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1; for (let i = 0; i <= n; i++) set(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, c); }
  };
  draw(a);
  const out = px.slice();
  if (outline) for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (px[y * w + x]) continue;
    const n = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const X = x + dx, Y = y + dy; return X >= 0 && Y >= 0 && X < w && Y < h && px[Y * w + X]; });
    if (n) out[y * w + x] = outline;
  }
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  out.forEach((col, i) => { if (col) { g.fillStyle = col; g.fillRect(i % w, Math.floor(i / w), 1, 1); } });
  return c;
}
function flipped(src) { const c = document.createElement('canvas'); c.width = src.width; c.height = src.height; const g = c.getContext('2d'); g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); return c; }

/* ---------- types, moves, species ---------- */
const TYPES = { plain: '#8a8f7a', flame: '#e0602a', tide: '#2f7fc4', leaf: '#3f9a3c', volt: '#c9a20f', stone: '#8a7356', gust: '#7f6fc4' };

const eff = (a, d) => STRONG[a].includes(d) ? 2 : WEAK[a].includes(d) ? .5 : 1;

// look: rx,ry body; head radius; ears; tail; extras
const SP = {

  blazelynx: { name: 'Blazelynx', type: 'flame', base: [62, 78, 60, 85], xp: 140, rate: 45, learn: [[14, 'flare'], [18, 'inferno']], look: { c: '#de5a26', b: '#ffcf8a', rx: 9, ry: 6.5, head: 7, ears: 'tall', tail: 'flame', feet: 4, mark: '#ffe066', size: 1 } },
  driplet: { name: 'Driplet', type: 'tide', base: [44, 48, 62, 43], xp: 63, rate: 45, evo: [14, 'torrentoad'], learn: [[1, 'tackle'], [1, 'harden'], [6, 'bubble'], [10, 'headbutt'], [13, 'crash'], [18, 'surge']], look: { c: '#4aa3df', b: '#d4f0ff', rx: 8.5, ry: 7, ears: 'fin', tail: 'fin', feet: 2 } },
  torrentoad: { name: 'Torrentoad', type: 'tide', base: [70, 70, 85, 58], xp: 142, rate: 45, learn: [[14, 'crash'], [18, 'surge']], look: { c: '#2f7fc4', b: '#bfe6ff', rx: 11, ry: 8.5, ears: 'fin', tail: 'fin', feet: 2, spots: '#1d5c99' } },

async function battle(foes, trainer) {

  BT = { foes, fi: 0, foe: foes[0], trainer, me: null, ps: { atk: 0, def: 0 }, es: { atk: 0, def: 0 }, eOff: { x: 80, y: 0 }, pOff: { x: -80, y: 0 }, eHide: false, pHide: true, eFlash: 0, pFlash: 0, eDrop: 0, pDrop: 0, orb: null, zone: S.y < 9 ? 'shrine' : S.y < 21 ? 'lake' : 'field' };

async function turn() {

  let playerMove = null;
  if (act === 0) {
    const i = await choose(me.moves.map(k => ({ label: MOVES[k].name, sub: MOVES[k].pow ? `Power ${MOVES[k].pow}` : (MOVES[k].kind === 'up' ? 'Raises Defense' : 'Lowers foe Attack'), tag: MOVES[k].type })).concat([{ label: 'Back' }]), { cols: 2 });

  } else if (act === 2) {

    if (ok) { sfx.back(); await say('Got away safely!'); return 'ran'; }
    await say("Couldn't get away!");
  }
  const foeMove = aiMove();
  if (playerMove) {
    const pm = MOVES[playerMove], fm = MOVES[foeMove];
    const meFirst = (pm.prio || 0) !== (fm.prio || 0) ? (pm.prio || 0) > (fm.prio || 0) : statsOf(BT.me).spd >= statsOf(foe).spd || (statsOf(BT.me).spd === statsOf(foe).spd && Math.random() < .5);

function aiMove() {

async function checkFaints() {

async function switchMenu(canCancel) {
  while (true) {

    if (canCancel) items.push({ label: 'Back' });
    const j = await choose(items, { cancel: canCancel, title: 'CHOOSE A CREATURE' });

}
async function withdraw() { await say(`Come back, ${nm(BT.me)}!`); await anim(300, t => BT.pOff.x = -80 * t); BT.pHide = true; phud.hidden = true; }
async function gainXp(m, amt) {

}
async function learn(m, k) {

async function throwOrb() {
  const f = BT.foe; await say('You threw a Capture Orb!');

async function evolve(m, to) {

let EVO = null;

/* ---------- render ---------- */
let frame = 0;

    const t = tileAt(x, y); const set = TILES[t] || TILES['.'];

  const ents = NPCS.map(n => ({ y: n.y, draw: () => ctx.drawImage(personSprite(n.look, n.id, n.dir, 0), n.x * TS - camX, n.y * TS - camY - 3) }));
  const step = P.moving && P.t > .2 && P.t < .8 ? P.step : 0;
  ents.push({ y: py, draw: () => { const sx = Math.round(px * TS - camX), sy = Math.round(py * TS - camY - 3); ctx.drawImage(personSprite(LOOK.hero, 'hero', S.dir, step), sx, sy); if (tileAt(S.x, S.y) === ',' && (!P.moving || P.t > .5)) { ctx.drawImage(TILES[','][f], 0, 10, 16, 6, sx, sy + 13, 16, 6); } } });
  ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());

const BG = { field: ['#9fd8f0', '#d6f0c8', '#7cc35a', '#5aa542'], lake: ['#8cc4ea', '#c8e6f0', '#6fb8a0', '#4f9a84'], shrine: ['#6a5a9a', '#c9a8d8', '#8a9a6a', '#6a7a4c'] };
function renderBattle(now) {
  const c = BG[BT.zone];
  ctx.fillStyle = c[0]; ctx.fillRect(0, 0, VW, 56); ctx.fillStyle = c[1]; ctx.fillRect(0, 56, VW, 14); ctx.fillStyle = c[2]; ctx.fillRect(0, 70, VW, 90);

function drawOrb(x, y, done) { x = Math.round(x); y = Math.round(y); ctx.fillStyle = '#16221b'; ctx.fillRect(x - 4, y - 5, 9, 11); ctx.fillRect(x - 5, y - 4, 11, 9); ctx.fillStyle = done ? '#f2c94c' : '#2a9d8f'; ctx.fillRect(x - 4, y - 4, 9, 4); ctx.fillStyle = '#eef5e6'; ctx.fillRect(x - 4, y + 1, 9, 4); ctx.fillStyle = '#16221b'; ctx.fillRect(x - 4, y, 9, 1); ctx.fillStyle = '#f2c94c'; ctx.fillRect(x - 1, y - 1, 3, 3); ctx.fillStyle = '#ffffffaa'; ctx.fillRect(x - 3, y - 3, 2, 1); }

let lastT = performance.now();
function loop(now) {

/* ---------- start ---------- */
const titleEl = $('#title');
async function newGame() {
  S = freshState(); titleEl.hidden = true; document.activeElement && document.activeElement.blur(); mode = 'world'; busy = true;
  await say('Elder Rowan: Ah, you\'re finally up! Today you choose your first partner creature.');
