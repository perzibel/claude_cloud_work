<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640">
  <title>GenQuest Games — GG logo</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#3b1a78"/>
      <stop offset="1" stop-color="#140829"/>
    </radialGradient>
    <linearGradient id="g1" x1="-150" y1="-150" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset="0.5" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ff2e63"/>
    </linearGradient>
    <linearGradient id="g2" x1="-150" y1="-150" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ff8ff"/>
      <stop offset="0.5" stop-color="#2fa8ff"/>
      <stop offset="1" stop-color="#8a3dff"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3d7f"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <!-- G shape: arc from upper-right, around the left, to right-middle, then crossbar inward -->
    <path id="G" d="M 92 -92 A 130 130 0 1 0 130 0 L 40 0" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="burstRay"><polygon points="-14,0 14,0 0,-340" /></g>
  </defs>

  <!-- Badge background -->
  <rect x="20" y="20" width="760" height="600" rx="64" fill="url(#bg)" stroke="#0b0418" stroke-width="10"/>
  <!-- Sunburst -->
  <g transform="translate(400 255)" fill="#ffffff" opacity="0.06">
    <use href="#burstRay"/><use href="#burstRay" transform="rotate(20)"/><use href="#burstRay" transform="rotate(40)"/>
    <use href="#burstRay" transform="rotate(60)"/><use href="#burstRay" transform="rotate(80)"/><use href="#burstRay" transform="rotate(100)"/>
    <use href="#burstRay" transform="rotate(120)"/><use href="#burstRay" transform="rotate(140)"/><use href="#burstRay" transform="rotate(160)"/>
    <use href="#burstRay" transform="rotate(180)"/><use href="#burstRay" transform="rotate(200)"/><use href="#burstRay" transform="rotate(220)"/>
    <use href="#burstRay" transform="rotate(240)"/><use href="#burstRay" transform="rotate(260)"/><use href="#burstRay" transform="rotate(280)"/>
    <use href="#burstRay" transform="rotate(300)"/><use href="#burstRay" transform="rotate(320)"/><use href="#burstRay" transform="rotate(340)"/>
  </g>

  <!-- Sword behind the letters (the "Quest") -->
  <g transform="translate(400 225) rotate(35)">
    <polygon points="-16,-200 0,-235 16,-200 16,110 -16,110" fill="#e8ecf5" stroke="#0b0418" stroke-width="8" stroke-linejoin="round"/>
    <line x1="0" y1="-200" x2="0" y2="100" stroke="#a9b3c9" stroke-width="5"/>
  </g>

  <!-- Second G (cool), drawn first -->
  <g transform="translate(538 250) scale(0.95) rotate(6)">
    <use href="#G" stroke="#0b0418" stroke-width="104" transform="translate(10 14)"/>
    <use href="#G" stroke="#0b0418" stroke-width="96"/>
    <use href="#G" stroke="url(#g2)" stroke-width="72"/>
    <path d="M 70 -110 A 110 110 0 0 0 -95 -55" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- First G (warm), on top so its crossbar hooks over the second G -->
  <g transform="translate(262 250) scale(0.95) rotate(-6)">
    <use href="#G" stroke="#0b0418" stroke-width="104" transform="translate(10 14)"/>
    <use href="#G" stroke="#0b0418" stroke-width="96"/>
    <use href="#G" stroke="url(#g1)" stroke-width="72"/>
    <path d="M 70 -110 A 110 110 0 0 0 -95 -55" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- Sword hilt in front -->
  <g transform="translate(400 225) rotate(35)">
    <rect x="-70" y="110" width="140" height="28" rx="14" fill="#ffd23f" stroke="#0b0418" stroke-width="8"/>
    <rect x="-14" y="136" width="28" height="70" rx="8" fill="#7a3cff" stroke="#0b0418" stroke-width="8"/>
    <circle cx="0" cy="222" r="20" fill="#ffd23f" stroke="#0b0418" stroke-width="8"/>
  </g>

  <!-- Sparkles -->
  <g fill="#fff6c2" stroke="#0b0418" stroke-width="4" stroke-linejoin="round">
    <path transform="translate(118 108)" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z"/>
    <path transform="translate(690 120) scale(0.8)" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z"/>
    <path transform="translate(705 400) scale(0.6)" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z"/>
  </g>

  <!-- Ribbon banner -->
  <g>
    <polygon points="110,478 160,478 160,560 110,560 132,519" fill="#8e1243" stroke="#0b0418" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="690,478 640,478 640,560 690,560 668,519" fill="#8e1243" stroke="#0b0418" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 140 462 Q 400 432 660 462 L 660 546 Q 400 516 140 546 Z" fill="url(#ribbon)" stroke="#0b0418" stroke-width="8" stroke-linejoin="round"/>
    <text x="400" y="510" text-anchor="middle" font-family="'Arial Black', 'Impact', 'DejaVu Sans', sans-serif" font-weight="900" font-size="44" letter-spacing="4" fill="#ffffff" stroke="#0b0418" stroke-width="3" paint-order="stroke">GENQUEST GAMES</text>
  </g>
</svg>
